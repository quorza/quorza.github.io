
name: Deploy Quorza Next.js Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Verify static export
        run: |
          if [ ! -d out ]; then
            echo "::error::The out directory was not generated."
            echo "Check next.config.ts for output: 'export'."
            echo "Also check the build logs for errors."
            exit 1
          fi

          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html is missing."
            echo "Inspect the build output and route configuration."
            exit 1
          fi

          echo "Static export verified:"
          ls -lah out/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
